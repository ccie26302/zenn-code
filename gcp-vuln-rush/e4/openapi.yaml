swagger: "2.0"
info: {title: sec2-api, version: "1.0"}
schemes: [https]
produces: [application/json]
x-google-backend:
  address: https://<service>.a.run.app
securityDefinitions:
  google_id_token:
    authorizationUrl: ""
    flow: implicit
    type: oauth2
    x-google-issuer: "https://accounts.google.com"
    x-google-jwks_uri: "https://www.googleapis.com/oauth2/v3/certs"
    x-google-audiences: "sec2-api"
security:
  - google_id_token: []
paths:
  /orders:
    get:
      operationId: getOrders
      parameters:
        - {name: user, in: query, type: string}
      responses:
        "200": {description: ok}
